<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR เครื่องซักผ้า (Washing Machine)</title>
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* ตกแต่งปุ่มกด UI ให้ทับอยู่บนกล้อง */
      .ui-container {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
        pointer-events: none; /* ให้คลิกทะลุได้ยกเว้นที่ปุ่ม */
      }
      button {
        pointer-events: auto;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: bold;
        background-color: #28a745;
        color: white;
        border: 3px solid #ffffff;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: transform 0.1s, background-color 0.3s;
      }
      button:active {
        transform: scale(0.95);
        background-color: #218838;
      }
    </style>

    <script>
      let currentSpeed = 1;
      
      // สร้าง Component สำหรับหมุนถังซัก
      AFRAME.registerComponent('spin-drum', {
        schema: { speed: {type: 'number', default: 1} },
        tick: function (time, timeDelta) {
          // ดึงค่าการหมุนปัจจุบัน
          let rotation = this.el.getAttribute('rotation');
          // เพิ่มค่าการหมุนแกน Z ตามความเร็ว (จำลองถังซักฝาหน้า)
          rotation.z += this.data.speed * (timeDelta / 10); 
          this.el.setAttribute('rotation', rotation);
        }
      });

      // ฟังก์ชันเมื่อกดปุ่มเปลี่ยนความเร็ว
      function changeSpeed() {
        currentSpeed += 3; // เพิ่มความเร็วทีละ 3
        if (currentSpeed > 10) {
          currentSpeed = 1; // ถ้ารอบสูงเกินให้กลับมาเริ่มต้น (โหมดซักปกติ)
        }
        
        const drum = document.querySelector('#drum');
        // อัปเดตค่าความเร็วใน component
        drum.setAttribute('spin-drum', `speed: ${currentSpeed}`);
        
        // เปลี่ยนข้อความปุ่ม
        let speedText = currentSpeed === 1 ? 'ซักปกติ (1x)' : `ปั่นหมาด (${currentSpeed}x)`;
        document.getElementById('speed-btn').innerText = speedText;
      }
    </script>
  </head>
  <body style="margin: 0; overflow: hidden; font-family: sans-serif;">
    
    <!-- ปุ่ม UI ปรับความเร็ว -->
    <div class="ui-container">
      <button id="speed-btn" onclick="changeSpeed()">ซักปกติ (1x)</button>
    </div>

    <!-- สร้าง Scene AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <!-- ใช้ Marker มาตรฐาน Hiro -->
      <a-marker preset="hiro">
        
        <!-- โมเดลเครื่องซักผ้า (สร้างจากรูปทรงพื้นฐาน) -->
        <a-entity position="0 0.5 0" rotation="-90 0 0">
          <!-- ตัวเครื่องภายนอก (สีขาว) -->
          <a-box position="0 0 0" depth="1" height="1.2" width="1" color="#F4F4F4" shadow></a-box>
          
          <!-- แผงควบคุมด้านบน (สีดำ) -->
          <a-box position="0 0.5 0.45" depth="0.1" height="0.1" width="0.9" color="#222222"></a-box>
          <a-cylinder position="-0.3 0.5 0.5" rotation="90 0 0" radius="0.03" height="0.05" color="red"></a-cylinder>
          <a-cylinder position="-0.15 0.5 0.5" rotation="90 0 0" radius="0.03" height="0.05" color="blue"></a-cylinder>

          <!-- กรอบฝาหน้าเครื่องซักผ้า -->
          <a-torus position="0 0 0.5" rotation="0 0 0" radius="0.36" radius-tubular="0.03" color="#CCCCCC"></a-torus>
          
          <!-- กระจกฝาหน้า (ใส) -->
          <a-cylinder position="0 0 0.5" rotation="90 0 0" radius="0.35" height="0.02" color="#87CEEB" opacity="0.6"></a-cylinder>
          
          <!-- ถังซักด้านในที่หมุนได้ (ใส่ลวดลายให้เห็นการหมุนชัดขึ้น) -->
          <a-cylinder id="drum" 
                      spin-drum="speed: 1" 
                      position="0 0 0.4" 
                      rotation="90 0 0" 
                      radius="0.34" 
                      height="0.8" 
                      color="#AAAAAA"
                      segments-radial="8"> <!-- ทำเป็น 8 เหลี่ยมจะเห็นการหมุนชัดเจน -->
          </a-cylinder>
        </a-entity>
        
      </a-marker>

      <!-- กล้อง AR -->
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
