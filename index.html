<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR เลือกวางเฟอร์นิเจอร์</title>
  
  <!-- นำเข้าไลบรารี model-viewer ของ Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: sans-serif; overflow: hidden; }
    
    /* ตั้งค่าตัวแสดงผล 3D ให้เต็มจอ */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #e0e0e0;
    }
    
    /* เมนูเลือกสินค้าด้านล่าง */
    .product-selector {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .product-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      background-color: #fff;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .product-btn:active, .product-btn.active {
      border-color: #007bff;
      color: #007bff;
      background-color: #eef6ff;
    }

    /* ปุ่มกดเข้าสู่โหมด AR ของมือถือ */
    .ar-button {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 
    ตัวแสดงผล AR: 
    ar-modes="webxr scene-viewer quick-look" จะทำให้รองรับทั้ง Android และ iOS 
  -->
  <model-viewer 
    id="furniture-viewer"
    src="https://modelviewer.dev/shared-assets/models/chair.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1"
    shadow-softness="1"
    alt="เฟอร์นิเจอร์ 3 มิติ">
    
    <!-- ปุ่มนี้จะแสดงขึ้นมาเมื่อเปิดเว็บด้วยมือถือที่รองรับ AR เท่านั้น -->
    <button slot="ar-button" class="ar-button">
      📸 ดูในพื้นที่จริง (AR)
    </button>
  </model-viewer>

  <!-- UI เลือกสินค้า -->
  <div class="product-selector">
    <button class="product-btn active" onclick="changeProduct(this, 'https://modelviewer.dev/shared-assets/models/chair.glb')">
      🪑 เก้าอี้ไม้
    </button>
    <button class="product-btn" onclick="changeProduct(this, 'https://modelviewer.dev/assets/ShopifyModels/GeoPlanter.glb')">
      🪴 กระถางต้นไม้
    </button>
  </div>

  <script>
    // ฟังก์ชันเปลี่ยนโมเดลเมื่อกดปุ่ม
    function changeProduct(btnElement, modelUrl) {
      // เปลี่ยนไฟล์โมเดลใน model-viewer
      const viewer = document.getElementById('furniture-viewer');
      viewer.src = modelUrl;

      // จัดการสีปุ่มที่ถูกเลือก
      document.querySelectorAll('.product-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
