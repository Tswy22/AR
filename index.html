<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR เลือกวางสินค้าเสมือนจริง</title>
  
  <!-- นำเข้าไลบรารี model-viewer สำหรับ AR ที่สมจริงที่สุด -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  
  <style>
    :root {
      --primary: #38d6b0;
      --bg-dark: #0b1210;
      --text-light: #eef2ef;
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background-color: var(--bg-dark); 
      font-family: "Noto Sans Thai", sans-serif; 
      overflow: hidden; 
    }
    
    /* ตัวแสดงผล 3D */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #1a2522; /* สีพื้นหลังตอนดู 3D ปกติ */
    }
    
    /* ปุ่มเข้าโหมด AR */
    .ar-btn {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--primary);
      color: #052a22;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(56, 214, 176, 0.4);
      cursor: pointer;
      z-index: 10;
    }

    .ar-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* เมนูเลือกสินค้าด้านล่าง */
    .product-dock {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px;
      background: rgba(12, 22, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      z-index: 10;
    }

    /* ซ่อน Scrollbar */
    .product-dock::-webkit-scrollbar { display: none; }

    .product-card {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 15px;
      color: var(--text-light);
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .product-card.active {
      background: rgba(56, 214, 176, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: bold;
    }
    
    /* ข้อความแนะนำด้านบน */
    .status-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 22, 20, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="status-bar">หมุนดูโมเดล หรือกดปุ่ม AR เพื่อส่องของจริง</div>

  <!-- 
    ระบบ model-viewer
    - environment-image="neutral": เพิ่มแสงสะท้อนระดับสตูดิโอให้โมเดลดูจริง
    - shadow-intensity: เพิ่มความเข้มของเงาตกกระทบพื้น
  -->
  <model-viewer 
    id="ar-viewer"
    src="https://modelviewer.dev/shared-assets/models/Mixer.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    environment-image="neutral"
    shadow-intensity="1.5"
    shadow-softness="1"
    exposure="1.2"
    alt="สินค้า 3 มิติ">
    
    <button slot="ar-button" class="ar-btn">
      📸 วางในพื้นที่จริง
    </button>
  </model-viewer>

  <!-- UI เลือกสินค้า (สามารถเพิ่มสินค้าได้ที่นี่) -->
  <div class="product-dock" id="product-list">
    <!-- ใส่ลิงก์ไฟล์ .glb ของสินค้าลงใน data-src -->
    <div class="product-card active" data-src="https://modelviewer.dev/shared-assets/models/Mixer.glb">
      เครื่องผสมอาหาร
    </div>
    <div class="product-card" data-src="https://modelviewer.dev/shared-assets/models/chair.glb">
      เก้าอี้วินเทจ
    </div>
    <div class="product-card" data-src="https://modelviewer.dev/shared-assets/models/Shoe.glb">
      รองเท้าผ้าใบ
    </div>
  </div>

  <script>
    const viewer = document.getElementById('ar-viewer');
    const products = document.querySelectorAll('.product-card');

    // ฟังก์ชันเมื่อกดเลือกสินค้า
    products.forEach(card => {
      card.addEventListener('click', function() {
        // ล้างสถานะ active จากปุ่มทั้งหมด
        products.forEach(p => p.classList.remove('active'));
        // เพิ่มสถานะ active ให้ปุ่มที่ถูกกด
        this.classList.add('active');
        
        // ดึงลิงก์โมเดลจาก data-src มาใส่ใน viewer
        const newSrc = this.getAttribute('data-src');
        viewer.src = newSrc;
      });
    });
  </script>

</body>
</html>
